<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h2>Event Report Generation </h2>
        <form id="userForm" >

          <!-- input lables and text boxes -->
            <label for="name"> Department Code :</label>
            <input type="text" id="name" name="name" required><br>

            <label for="nature">Nature of the Event :</label>
            <select id="nature" name="nature" required>
                <option value="Alumini Meet">Alumini Meet</option>
                <option value="Awarenes to Trends in Technology">Awarenes to Trends in Technology</option>
                <option value="Carer Counselling/Traning">Carer Counselling/Traning</option>
                <option value="Conference">Conference</option>
                <option value="Culutural">Culutural</option>
                <option value="Extension">Extension</option>
                <option value="FDP">FDP</option>
                <option value="Gender Equlity Program">Gender Equlity Program</option>
                <option value="Guest Lecture">Guest Lecture</option>
                <option value="language & Communication Skills">Language & Communication Skills</option>
                <option value="MOU">MOU</option>
                <option value="Paper Presentation">Paper Presentation</option>
                <option value="Seminar/Webinar">Seminar/Webinar</option>
                <option value="Soft Skills">Soft Skills</option>
                <option value="Traning for Competitive Exam">Traning for Competitive Exam</option>
                <option value="Workshop">Workshop</option>
                <option value="Workshop on IPR">Workshop on IPR</option>
                <option value="Workshop on Research Methodology">Workshop on Research Methodology</option>
                <option value="Yoga">Yoga</option>
                <!-- Add more options as needed -->
                 </select><br>
 
               <label for="title">Title of the Event :</label>
               <input type="text" id="title" name="title" ><br>

              <label for="fromDate">From Date :</label>
              <input type="date" id="fromDate" name="fromDate" max="" required><br>
              <label for="toDate">To Date :</label>
              <input type="date" id="toDate" name="toDate" max="" required>

               <br>
               <label for="ndays">Number of Days :</label>
               <input type="number" id="ndays" name="ndays" required>
               <br><br>
            
            
             <label for="dname">Department / Club : (Example: INFORMATION TECHNOLOGY) </label>
             <input type="text" id="dname" name="dname" ><br>

             <label for="chname">Chief Guest Name :</label>
             <textarea  id="chname" name="chname" rows="4" required></textarea> <br>

             <label for="guestdetails">Chief Guest Details (Max 100 words) :</label>
             <textarea id="guestdetails" name="guestdetails" rows="4" required></textarea><br>

             <label for="Vname">Venue : </label>
             <input type="text" id="Vname" name="Vname"><br>

             <label for="participants">Number of Participants :</label>
             <input type="number" id="participants" name="participants" min="1" required><br>

             <label for="convenor">Convenor : </label>
             <input type="text" id="convenor" name="convenor"><br>

             <label for="coordinators">Coordinator(s) :</label>
             <input type="text" id="coordinators" name="coordinators"><br><br>
        
                 <!-- Coordinator button creation -->
                <div class="button-container">
                <button id="addCoordinatorBtn" type="button" onclick="addCoordinator()">Add Coordinator</button>
                </div>
                <div id="additionalCoordinators" class="coordinator-container"></div>
              
                <label for="Stratum Of Event :">Stratum of Event :</label>
                <select id="stratum" name="stratum" required>
                <option value="International">International</option>
                <option value="Regional">Regional</option>
                <option value="State">State</option>
                <option value="National">National</option>
                <!-- Add more options as needed -->
                </select><br>

                <label for="purpose">Scope of Event  (Max 100 words) :</label>
                <textarea id="purpose" name = "purpose" rows="4" required></textarea><br>

                <label for="outcome">Outcomes of the Event (Max 100 words) :</label>
                <textarea id="outcome" name="outcome" rows="4" required></textarea><br>

                <label for="photo"><B>Upload Photographs : (File size below 500 kb is preferable)</B></label><br>
                <label for="photo">Upload Invitation / Poster</label>
                <input type="file" id="photo1" name="photo1" accept="image/*" required><br>

                <label for="photo">Upload Image1 :</label>
                <input type="file" id="photo2" name="photo2" accept="image/*" required><br>

                <label for="photo">Upload Image2 :</label>
                <input type="file" id="photo3" name="photo3" accept="image/*" required><br>
            
                <label for="photo">Upload Image3 :</label>
                <input type="file" id="photo4" name="photo4" accept="image/*" required><br>

                 <!-- addphoto button creation -->
                 <div class="button-container">
                 <button id="addPhotoBtn" type="button" onclick="addPhoto()">Add Photo</button>
                 </div>
                  <div id="additionalPhotos" class="photo-container"></div>
                 <!-- save button creation -->
                  <div class="buttons">
                  <button type="button" id="saveBtn">Save</button>
                
            </div>
        </form>
    </div>

<script>
      // Set max attribute to today's date
      const today = new Date().toISOString().split('T')[0];
      document.getElementById('fromDate').setAttribute('max', today);
      document.getElementById('toDate').setAttribute('max', today);
</script>
   
    <script>
        // Assuming userData.fromDate and userData.toDate are strings in ISO format (YYYY-MM-DD)
        const userData = {
            fromDate: "2024-03-01",
            toDate: "2024-03-15"
        };
    
        // Function to format date as "dd-mm-yy"
        function formatDate(dateString) {
            const [year, month, day] = dateString.split('-');
            return `${day}-${month}-${year.slice(2)}`;
        }
    
        // Format dates
        const fromDateFormatted = formatDate(userData.fromDate);
        const toDateFormatted = formatDate(userData.toDate);
    
        // Insert formatted dates into HTML
        document.getElementById('fromDate').textContent = fromDateFormatted;
        document.getElementById('toDate').textContent = toDateFormatted;
    </script>



    <!-- Calculate number of days from date  -->
   <script>
  function calculateDays() {
    var fromDate = new Date(document.getElementById('fromDate').value);
    var toDate = new Date(document.getElementById('toDate').value);
    var differenceInTime = toDate.getTime() - fromDate.getTime();
    var differenceInDays = differenceInTime / (1000 * 3600 * 24);

    // If the dates are the same, set differenceInDays to 1
    if (differenceInTime <= 0) {
        differenceInDays = 1;
    } else {
        // Add one day to the difference for all cases
        differenceInDays += 1;
    }

    document.getElementById('ndays').value = differenceInDays;
}

document.getElementById('fromDate').addEventListener('change', calculateDays);
document.getElementById('toDate').addEventListener('change', calculateDays);
</script>

<!-- Script for Adding coordinator -->
    <script>
    var coordinatorCount = 1;
  
    function addCoordinator() {
      if (coordinatorCount < 3) {
        coordinatorCount++;
  
        var div = document.getElementById('additionalCoordinators');
        var label = document.createElement('label');
        label.setAttribute('for', 'coordinators' + coordinatorCount);
        label.textContent = 'coordinators ' + coordinatorCount + ':';
  
        var input = document.createElement('input');
        input.setAttribute('type', 'text');
        input.setAttribute('id', 'coordinators' + coordinatorCount);
        input.setAttribute('name', 'coordinators' + coordinatorCount);
        input.setAttribute('size', '100');
  
        var br = document.createElement('br');
        var hr = document.createElement('hr');
  
        div.appendChild(label);
        div.appendChild(input);
        div.appendChild(br);
        div.appendChild(hr);
      } else {
        alert('You can add a maximum of 3 coordinators.');
      }
    }
  </script>

<!-- Script for Adding photos -->
  <script>
    var photoCount = 4;

function addPhoto() {
  if (photoCount < 7) {  // Allow up to 3 total photo uploads
    photoCount++;

    var div = document.getElementById('additionalPhotos');
    
    var label = document.createElement('label');
    label.setAttribute('for', 'photo' + photoCount);
    label.textContent = 'Upload Image' + photoCount + ':';

    var input = document.createElement('input');
    input.setAttribute('type', 'file');
    input.setAttribute('id', 'photo' + photoCount);
    input.setAttribute('name', 'photo' + photoCount);
    input.setAttribute('accept', 'image/*');
    input.required = true;

    var br = document.createElement('br');
    var hr = document.createElement('hr');

    div.appendChild(label);
    div.appendChild(input);
    div.appendChild(br);
    div.appendChild(hr);
  } else {
    alert('You can add a maximum of 3 photographs.');
    document.getElementById('addPhotoBtn').disabled = true;
  }
}
  </script>
    <script src="script.js"></script>
</body>
</html>
